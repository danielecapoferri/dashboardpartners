<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Dashboard – Immobiliare.it Mutui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --blue:#0074c1; --blue-low:#eaf3fa; --red:#e50013;
  --txt-high:#24292f; --txt-med:#57606a; --txt-low:#6e7781; --txt-lower:#8c959f;
  --dis-bg:#f3f4f6; --dis-txt:#aeafb3;
  --bd:#e1e5ea; --bd-int:#c9d1d9; --bg:#ffffff; --bg-alt:#f5f7f9;
  --err:#cf0043; --err-low:#fff0f4; --warn:#fba204; --warn-low:#fff6e8;
  --succ:#11a874; --succ-dark:#018258; --succ-low:#dcf5ed;
  --font:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--txt-high);background:var(--bg-alt);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body[data-bg="blue"]{background:var(--blue)}
button{font-family:inherit;-webkit-appearance:none;appearance:none}
a{color:var(--blue);text-decoration:none}
p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Desktop block ---------- */
#desk{display:none;position:fixed;inset:0;background:#e9ecef;align-items:center;justify-content:center;text-align:center;padding:24px}
#desk .box{max-width:420px;display:flex;flex-direction:column;gap:8px;align-items:center}
#desk h1{font:500 20px/32px var(--font);margin:16px 0 0;color:var(--txt-high)}
#desk p{font:400 16px/26px var(--font);color:var(--txt-med)}
@media (min-width:769px){ #app,#ov{display:none!important} #desk{display:flex} }

/* ---------- Views ---------- */
.view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg-alt);padding-top:env(safe-area-inset-top,0px)}
.view.blue{background:var(--blue)}
.content{flex:1;display:flex;flex-direction:column;gap:24px;padding:24px 16px}

/* Header */
.app-header{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 4px;background:var(--bg);border-bottom:1px solid var(--bd)}
.icon-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;color:var(--txt-high);border-radius:10px}
.icon-btn[aria-disabled="true"]{cursor:default}
.logo{display:block;line-height:0}
.avatar{width:32px;height:32px;border-radius:16px;background:var(--blue-low);color:var(--blue);font:500 14px/24px var(--font);border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.avatar.lg{width:40px;height:40px;border-radius:20px;font:500 16px/26px var(--font);cursor:default}
.support{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--bd);font:400 12px/20px var(--font);color:var(--txt-med)}
.support svg{flex:none;color:var(--blue)}
.back-bar{display:flex;gap:8px;align-items:center;width:100%;padding:8px 16px;background:var(--bg);border:0;border-bottom:1px solid var(--bd);font:500 16px/26px var(--font);color:var(--blue);cursor:pointer;text-align:left}

/* Buttons */
.btn{width:100%;min-height:52px;border-radius:10px;border:0;padding:13px 32px;font:500 16px/26px var(--font);background:var(--red);color:#fff;cursor:pointer}
.btn:disabled{background:var(--dis-bg);color:var(--dis-txt);cursor:default}
.link-btn{background:none;border:0;padding:0;font:500 16px/26px var(--font);color:var(--blue);cursor:pointer}
.cta-bar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--bd);box-shadow:0 -4px 12px rgba(0,0,0,.06);padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.navbar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--bd);box-shadow:0 -4px 12px rgba(0,0,0,.06);padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:24px}
.tab{width:48px;height:54px;padding:3px 0 0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--txt-lower);font:400 12px/20px var(--font)}
.tab .ti{width:40px;height:40px;padding-top:2px;display:flex;align-items:center;justify-content:center}
.tab .tl{margin-top:-6px}
.tab.cur{color:var(--blue);font-weight:500}

/* Textfield */
.tf{display:flex;flex-direction:column;gap:8px}
.tf-label{font:500 16px/26px var(--font);color:var(--txt-high)}
.field{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 16px;border:1px solid var(--bd-int);border-radius:10px;background:var(--bg);transition:box-shadow .12s,border-color .12s}
.field.lead{padding-left:12px}
.field.trail{padding-right:16px}
.field:focus-within{border-color:var(--txt-high);box-shadow:0 0 0 2px var(--bd-int)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0;font:400 16px/26px var(--font);color:var(--txt-high)}
.field input::placeholder{color:var(--txt-low);opacity:1}
.field .lic{flex:none;color:var(--txt-low);display:flex}
.eye{flex:none;width:24px;height:24px;padding:0;border:0;background:none;color:var(--txt-lower);cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye[hidden]{display:none}
.flag{display:flex;width:24px;height:18px;border-radius:2px;overflow:hidden;flex:none}
.flag i{flex:1}
.prefix{display:flex;align-items:center;gap:4px;font:400 16px/26px var(--font);color:var(--txt-high);flex:none}

/* Login */
.login-header{height:64px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--bd)}
.login-main{display:flex;flex-direction:column;gap:24px;padding:32px 16px 24px}
.login-card{background:var(--bg);border-radius:20px;box-shadow:0 1px 2px rgba(36,41,47,.08),0 2px 8px rgba(36,41,47,.08);padding:20px 16px 24px;display:flex;flex-direction:column;gap:24px}
.t20{font:500 20px/32px var(--font);color:var(--txt-high);margin:0}
.s14{font:400 14px/24px var(--font);color:var(--txt-low)}
.err-banner{background:var(--err-low);border:1px solid var(--err);border-radius:5px;padding:4px 12px;font:500 14px/24px var(--font);color:var(--err)}
.stack8{display:flex;flex-direction:column;gap:8px}
.stack16{display:flex;flex-direction:column;gap:16px}
.forgot{align-self:flex-end;background:none;border:0;padding:0;font:500 14px/24px var(--font);color:var(--blue);cursor:pointer}
.oam{padding:0 16px;font:400 12px/20px var(--font);color:#fff}
.center{align-self:center}

/* Cards */
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.caps14{font:500 14px/24px var(--font);letter-spacing:.7px;text-transform:uppercase;color:var(--txt-med);margin:0}
.caps12{font:500 12px/20px var(--font);letter-spacing:.36px;text-transform:uppercase;color:var(--txt-med);margin:0}
.account{display:flex;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--bd);border-radius:12px}
.account .name{font:500 16px/26px var(--font);color:var(--txt-high)}
.account .meta{font:400 14px/24px var(--font);color:var(--txt-med)}
.account .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.fa-banner{background:var(--err);border-radius:5px;padding:8px 8px 8px 12px;font:500 14px/24px var(--font);color:#fff}
.stack20{display:flex;flex-direction:column;gap:20px}
.pw-err{font:400 14px/24px var(--font);color:var(--err)}
.reqs{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.req{display:flex;gap:6px;align-items:center;font:400 14px/24px var(--font);color:var(--txt-med);min-height:24px}
.req .mk{display:flex;align-items:center;justify-content:center;flex:none;color:var(--succ-dark)}
.req .dash{color:var(--txt-med);width:auto}

/* Home */
.welcome{display:flex;flex-direction:column;gap:4px}
.welcome h1{font:500 20px/32px var(--font);margin:0;color:var(--txt-high)}
.welcome p{font:400 16px/26px var(--font);color:var(--txt-med)}
.modes-wrap{display:flex;flex-direction:column;gap:12px}
.modes{display:flex;gap:8px}
.mode{flex:1;min-width:0;position:relative;background:var(--bg);border:1px solid var(--bd-int);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;cursor:pointer;text-align:left}
.mode.sel{border:1.5px solid var(--blue);padding:11.5px 11.5px 9.5px}
.mode .ibox{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.mode.sel .ibox{border:0;background:var(--blue-low)}
.mode .lbl{font:500 14px/24px var(--font);color:var(--txt-high);white-space:nowrap}
.mode .zap{position:absolute;right:10px;top:12px;display:flex}
.mode.sel .zap{right:9.5px;top:11.5px}
.mode-desc{font:400 14px/24px var(--font);color:var(--txt-med)}
.warn-box{display:flex;gap:8px;padding:12px;background:var(--warn-low);border-radius:10px;font:400 14px/24px var(--font);color:var(--txt-high)}
.warn-box svg{flex:none;margin-top:2px}
.info-row{display:flex;gap:8px;font:400 14px/24px var(--font);color:var(--txt-med);padding-right:24px}
.info-row svg{flex:none;margin-top:2px;color:var(--txt-low)}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head .caps14{flex:1}
.chev{width:40px;height:40px;flex:none;border:1px solid var(--bd-int);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--txt-high);cursor:pointer;padding:0}
.chev:disabled{color:var(--dis-txt);border-color:var(--bd);cursor:default}
.days{display:flex;gap:8px}
.day-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.day{width:100%;border:1px solid var(--bd-int);border-radius:10px;padding:8px 0;background:var(--bg);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.day .d1{font:500 14px/24px var(--font);color:var(--txt-low)}
.day .d2{font:500 18px/28px var(--font);color:var(--txt-high)}
.day .d3{font:500 12px/20px var(--font);color:var(--txt-low);letter-spacing:.36px;text-transform:uppercase}
.day.sel{background:var(--blue-low);border-color:var(--blue)}
.day.sel .d2{color:var(--blue)}
.day:disabled{background:var(--dis-bg);border-color:var(--dis-bg);cursor:default}
.day:disabled span{color:var(--dis-txt)}
.marker{width:6px;height:6px;border-radius:3px;background:var(--blue)}
.slots-empty{border:1px dashed var(--bd-int);border-radius:10px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;font:400 14px/24px var(--font);color:var(--txt-med)}
.slots-empty svg{color:var(--blue)}
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font:400 16px/26px var(--font);color:var(--txt-high);cursor:pointer;padding:0}
.slot.sel{background:var(--blue-low);border-color:var(--blue);color:var(--blue);font-weight:500}
.slot:disabled{background:var(--dis-bg);border-color:var(--dis-bg);color:var(--dis-txt);cursor:default}
.consent{display:flex;gap:12px;padding:12px;background:var(--bg-alt);border-radius:12px;border:0;text-align:left;cursor:pointer;font:400 14px/24px var(--font);color:var(--txt-med);width:100%}
.cb{width:24px;height:24px;flex:none;border-radius:5px;border:1.5px solid var(--bd-int);background:var(--bg);display:flex;align-items:center;justify-content:center;color:#fff}
.consent[aria-checked="true"] .cb{background:var(--blue);border-color:var(--blue)}
.consent[aria-checked="false"] .cb svg{visibility:hidden}

/* Clienti */
.cl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:24px 16px}
.cl-card{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.cl-card h1{font:500 20px/32px var(--font);margin:0;color:var(--txt-high);padding:0 8px}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border:0;border-radius:5px;background:var(--blue-low);color:var(--blue);font:500 16px/26px var(--font);cursor:pointer}
.btn-sec svg{flex:none}
.cl-card p{font:400 16px/26px var(--font);color:var(--txt-low);margin-top:4px}
.cl-card svg{color:var(--blue)}
.cl-emoji{display:block;width:72px;height:72px;font-size:64px;line-height:72px;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cl-link{background:none;border:0;font:500 16px/26px var(--font);color:#fff;cursor:pointer;padding:8px}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(18,23,33,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:316px;max-width:86vw;background:var(--bg);box-shadow:4px 0 16px rgba(0,0,0,.12);z-index:21;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 calc(32px + env(safe-area-inset-bottom,0px));transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dr-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px;flex:none}
.dr-user{display:flex;align-items:center;gap:12px;padding:16px 4px 16px 16px;border:0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);background:var(--bg);text-align:left;cursor:pointer;width:100%}
.dr-user .info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.dr-user .name{font:500 16px/26px var(--font);color:var(--txt-high)}
.dr-user .role{font:400 14px/24px var(--font);color:var(--txt-med)}
.dr-user .go{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--txt-high)}
.dr-user.cur{background:var(--bg-alt)}
.dr-nav{display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.nav-item{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:8px;border:0;background:none;font:500 16px/26px var(--font);color:var(--txt-lower);cursor:pointer;text-align:left;width:100%}
.nav-item.cur{background:var(--blue-low);color:var(--blue)}
.dr-spacer{flex:1}
.dr-help{display:flex;align-items:center;gap:25px;padding:16px 12px 20px 20px;background:var(--bg-alt)}
.dr-help .t{flex:1;display:flex;flex-direction:column}
.dr-help .t b{font:500 16px/26px var(--font);color:var(--txt-high)}
.dr-help .t span{font:400 14px/24px var(--font);color:var(--txt-med)}
.dr-help a{width:48px;height:48px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.dr-exit{display:flex;align-items:center;gap:12px;padding:16px 16px 0 20px;border:0;border-top:1px solid var(--bd);background:none;font:400 16px/26px var(--font);color:var(--txt-high);cursor:pointer;text-align:left;width:100%}

.modal-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(18,23,33,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal{position:relative;width:343px;max-width:100%;max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border-radius:10px;padding:20px 16px;display:flex;flex-direction:column;gap:24px;transform:translateY(12px) scale(.98);transition:transform .2s}
.modal-wrap.on .modal{transform:none}
.m-head{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.m-check{width:56px;height:56px;border-radius:50%;background:var(--succ-low);display:flex;align-items:center;justify-content:center}
.m-check path{stroke-dasharray:40;stroke-dashoffset:40}
.modal-wrap.on .m-check path{animation:draw .45s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.m-title{font:500 16px/24px var(--font);color:var(--txt-high)}
.m-desc{font:400 14px/24px var(--font);color:var(--txt-med)}
.m-desc b{font-weight:500;color:var(--txt-high)}
.m-close{position:absolute;top:20px;right:16px;width:24px;height:24px;border:0;background:none;padding:0;color:var(--txt-lower);cursor:pointer}
.m-sum{background:var(--bg-alt);border-radius:10px;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.m-grid{display:grid;grid-template-columns:92px 1fr;column-gap:26px;row-gap:16px;align-items:center}
.m-k{display:flex;align-items:center;gap:8px;font:400 14px/21px var(--font);color:var(--txt-med);white-space:nowrap}
.m-k svg{color:var(--blue);flex:none}
.m-v{font:500 14px/21px var(--font);color:var(--txt-high)}
.m-alert{display:flex;gap:12px;padding:8px 12px;background:var(--warn-low);border-radius:10px;font:400 14px/24px var(--font);color:var(--txt-high)}
.m-alert svg{flex:none;margin-top:2px}

.loader{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center}
.loader.on{display:flex}
.loader .box{width:72px;height:72px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(36,41,47,.08)}
.loader svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:16px;right:16px;bottom:calc(97px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px;align-items:center;padding:8px 8px 8px 12px;background:var(--succ);border-radius:5px;color:#fff;font:500 14px/24px var(--font);transform:translateY(8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{width:32px;height:32px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="desk"><div class="box">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0074c1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
  <h1>Prototipo navigabile da smartphone</h1>
  <p>Apri questo link dal telefono per provare la dashboard.</p>
</div></div>

<div id="app"></div>

<div id="ov">
  <div class="scrim" id="scrim" data-action="close-drawer"></div>
  <nav class="drawer" id="drawer" aria-label="Menu" aria-hidden="true"></nav>
  <div class="modal-wrap" id="modal" data-action="close-modal-bg" role="dialog" aria-modal="true" aria-labelledby="m-title"></div>
  <div class="toast" id="toast" role="status"><span></span><button type="button" data-action="close-toast" aria-label="Chiudi"></button></div>
  <div class="loader" id="loader" aria-live="polite"><div class="box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M1 12C1 9.8244 1.64514 7.69767 2.85384 5.88873C4.06253 4.07979 5.7805 2.66989 7.79048 1.83732C9.80047 1.00476 12.0122 0.786924 14.146 1.21136C16.2798 1.6358 18.2398 2.68345 19.7782 4.22183C21.3166 5.7602 22.3642 7.72022 22.7886 9.85401C23.2131 11.9878 22.9952 14.1995 22.1627 16.2095C21.3301 18.2195 19.9202 19.9375 18.1113 21.1462C16.3023 22.3549 14.1756 23 12 23" stroke="#E50013" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr">Caricamento</span></div></div>
</div>

<script>
(function(){

/* ================= Date ================= */
const GG = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const GG3 = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MM = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const dOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = t => { const [y,m,d] = t.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sameDay = (a,b) => iso(a) === iso(b);
const SLOTS = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','15:00','15:30','16:00','16:30'];
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };

const MAX_PAGE = 3;
function workingDays(){
  const out = []; let d = dOnly(new Date());
  while (out.length < (MAX_PAGE + 1) * 5) { if (d.getDay() !== 0 && d.getDay() !== 6) out.push(new Date(d)); d = addDays(d, 1); }
  return out;
}
function weekDays(i){ return workingDays().slice(i*5, i*5 + 5); }
function slotState(day, t){
  const now = new Date();
  if (sameDay(day, now) && mins(t) <= now.getHours()*60 + now.getMinutes()) return 'off';
  const seed = day.getFullYear()*372 + day.getMonth()*31 + day.getDate();
  const a = (seed*7) % SLOTS.length, b = (seed*13 + 5) % SLOTS.length;
  const idx = SLOTS.indexOf(t);
  return (idx === a || idx === b) ? 'off' : 'on';
}
function dayDisabled(day){
  const today = dOnly(new Date());
  if (day < today) return true;
  if (sameDay(day, today)) return SLOTS.every(t => slotState(day,t) === 'off');
  return false;
}
function rangeLabel(days){
  const a = days[0], b = days[4];
  if (a.getMonth() === b.getMonth()) return `Dal ${a.getDate()} al ${b.getDate()} ${MM[b.getMonth()]} ${b.getFullYear()}`;
  if (a.getFullYear() === b.getFullYear()) return `Dal ${a.getDate()} ${MM[a.getMonth()]} al ${b.getDate()} ${MM[b.getMonth()]} ${b.getFullYear()}`;
  return `Dal ${a.getDate()} ${MM[a.getMonth()]} ${a.getFullYear()} al ${b.getDate()} ${MM[b.getMonth()]} ${b.getFullYear()}`;
}
const longDate = d => `${cap(GG[d.getDay()])}, ${d.getDate()} ${cap(MM[d.getMonth()])}`;

const ROUTES = ['login','recupera-password','primo-accesso','home','clienti','profilo'];
function route(){
  let r = (location.hash || '').replace('#','');
  if (!ROUTES.includes(r)) r = S.logged ? (S.firstDone ? 'home' : 'primo-accesso') : 'login';
  if (!S.logged && !['login','recupera-password'].includes(r)) r = 'login';
  if (S.logged && !S.firstDone) r = 'primo-accesso';
  if (S.logged && S.firstDone && ['login','recupera-password','primo-accesso'].includes(r)) r = 'home';
  return r;
}
let current = null;
function render(){
  const r = route();
  if (('#' + r) !== location.hash) history.replaceState(null, '', '#' + r);
  if (r === 'profilo' && current && current !== 'profilo') S.prev = current;
  current = r;

/* ================= Modale ================= */
function nextImmediate(){
  const now = new Date(); const wd = now.getDay(); const m = now.getHours()*60 + now.getMinutes();
  if (wd >= 1 && wd <= 5 && m >= 9*60 && m < 17*60+30) {
    const n = Math.ceil((m+1)/30)*30; const hh = String(Math.floor(n/60)).padStart(2,'0'), mm = String(n%60).padStart(2,'0');
    return {date:`Oggi - ${longDate(now)}`, time:`${hh}:${mm}`};
  }
  let d = addDays(dOnly(now), (m >= 17*60+30 || wd === 0 || wd === 6) ? 1 : 0);
  while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
  const label = sameDay(d, now) ? 'Oggi - ' : sameDay(d, addDays(now,1)) ? 'Domani - ' : '';
  return {date: label + longDate(d), time:'09:00'};
}

        setTimeout(() => { if (!a.isConnected) return; a.innerHTML = original; a.style.width = ''; a.style.cursor = ''; a.removeAttribute('aria-disabled'); delete a.dataset.busy; }, 3000);
      };
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(_) {} ta.remove(); done(); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) closeModal(); else closeDrawer(); }
});

render();
})();
</script>
